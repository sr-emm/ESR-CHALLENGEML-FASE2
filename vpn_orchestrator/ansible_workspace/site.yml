
---
# ==============================================================================
# VPN SITE-TO-SITE: FORTIGATE <-> PALO ALTO
# Generado automaticamente
# ==============================================================================

# PLAY 0: PREPARACIÓN DEL ENTORNO
- name: Instalar dependencias requeridas para Palo Alto
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Instalar setuptools
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -m pip install --upgrade --quiet setuptools"
      changed_when: true
    
    - name: Instalar librerías Palo Alto
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -m pip install --quiet pan-python pan-os-python xmltodict requests"
      changed_when: true

# PLAY 1: FORTIGATE
- name: Configurar Overlay FortiGate
  hosts: fortigates
  connection: httpapi
  gather_facts: no
  collections:
    - fortinet.fortios
  
  vars:

        # --- GLOBAL ---
        vpn_name: "S2S-OVERLAY"
        vpn_psk: "FortinetVPN2025a1!"

        # --- CRYPTO ---
        phase1_proposal: "aes128-sha256"
        phase2_proposal: "aes128-sha256"
        dh_group: "14"
        pa_enc_algo: "aes-128-cbc"
        pa_auth_algo: "sha256"

        # --- FORTIGATE VARS ---
        fg_wan_intf: "port1"
        fg_lan1_intf: "port2"
        fg_lan2_intf: "port3"
        fg_wan_ip: "200.200.200.1"
        fg_vdom: "root"
    
        fg_lan1_cidr_raw: "10.100.102.0/24"
        fg_lan2_cidr_raw: "10.100.100.0/24"
        fg_lan1_mask: "10.100.102.0 255.255.255.0"
        fg_lan2_mask: "10.100.100.0 255.255.255.0"

        fg_remote_lan1_cidr: "10.200.202.0/24"
        fg_remote_lan2_cidr: "10.200.203.0/24"
        fg_remote_lan1_mask: "10.200.202.0 255.255.255.0"
        fg_remote_lan2_mask: "10.200.203.0 255.255.255.0"

        fg_tunnel_ip: "169.255.1.1 255.255.255.255"
        fg_remote_tunnel_ip: "169.255.1.2 255.255.255.255"
        fg_remote_gw: "100.100.100.1"

        # --- PALO ALTO VARS ---
        pa_wan_intf: "ethernet1/1"
        pa_lan1_intf: "ethernet1/2"
        pa_lan2_intf: "ethernet1/3"
        pa_zone: "VPN_Zone"

        pa_lan1_cidr: "10.200.202.0/24"
        pa_lan2_cidr: "10.200.203.0/24"
        pa_remote_lan1_cidr: "10.100.102.0/24"
        pa_remote_lan2_cidr: "10.100.100.0/24"

        pa_wan_ip: "100.100.100.1"
        pa_tunnel_ip: "169.255.1.2/32"
        pa_peer_ip: "200.200.200.1"
        pa_nexthop_ip: "169.255.1.1"

        pa_provider:
          ip_address: "10.100.100.107"
          username: "admin"
          password: "1234Wasd."


  tasks:
    - name: Configurar VPN Phase 1 (IKE Gateway)
      fortios_vpn_ipsec_phase1_interface:
        vdom: "{{ fg_vdom }}"
        state: "present"
        vpn_ipsec_phase1_interface:
          name: "{{ vpn_name }}"
          interface: "{{ fg_wan_intf }}" 
          ike_version: "2"
          peertype: "any"
          net_device: "disable"
          proposal: "{{ phase1_proposal }}"
          dhgrp: "{{ dh_group }}"
          remote_gw: "{{ fg_remote_gw }}" 
          psksecret: "{{ vpn_psk }}"
          nattraversal: "disable"
      ignore_errors: yes

    - name: Configurar VPN Phase 2 (IPsec SA)
      fortios_vpn_ipsec_phase2_interface:
        vdom: "{{ fg_vdom }}"
        state: "present"
        vpn_ipsec_phase2_interface:
          name: "{{ vpn_name }}-P2"
          phase1name: "{{ vpn_name }}"
          proposal: "{{ phase2_proposal }}"
          dhgrp: "{{ dh_group }}"
          keylifeseconds: 3600
          src_subnet: "0.0.0.0 0.0.0.0" 
          dst_subnet: "0.0.0.0 0.0.0.0"
          auto_negotiate: "enable"
      ignore_errors: yes

    - name: Configurar Interfaz Túnel (VTI)
      fortios_system_interface:
        vdom: "{{ fg_vdom }}"
        state: "present"
        system_interface:
          name: "{{ vpn_name }}"
          vdom: "{{ fg_vdom }}"
          type: "tunnel"
          interface: "{{ fg_wan_intf }}"
          ip: "{{ fg_tunnel_ip }}"
          remote_ip: "{{ fg_remote_tunnel_ip }}"
          allowaccess: "ping"

    # --- OBJETOS DE RED ---
    - name: Obj LAN Remota 1
      fortios_firewall_address:
        vdom: "{{ fg_vdom }}"
        state: "present"
        firewall_address:
            name: "REMOTE_LAN1_{{ fg_remote_lan1_cidr | regex_replace('/', '_') }}"
            subnet: "{{ fg_remote_lan1_mask }}" 

    - name: Obj LAN Remota 2
      fortios_firewall_address:
        vdom: "{{ fg_vdom }}"
        state: "present"
        firewall_address:
            name: "REMOTE_LAN2_{{ fg_remote_lan2_cidr | regex_replace('/', '_') }}"
            subnet: "{{ fg_remote_lan2_mask }}" 

    - name: Obj LAN Local 1
      fortios_firewall_address:
        vdom: "{{ fg_vdom }}"
        state: "present"
        firewall_address:
            name: "LOCAL_LAN1_{{ fg_lan1_cidr_raw | regex_replace('/', '_') }}"
            subnet: "{{ fg_lan1_mask }}"

    - name: Obj LAN Local 2
      fortios_firewall_address:
        vdom: "{{ fg_vdom }}"
        state: "present"
        firewall_address:
            name: "LOCAL_LAN2_{{ fg_lan2_cidr_raw | regex_replace('/', '_') }}"
            subnet: "{{ fg_lan2_mask }}"

    # --- ENRUTAMIENTO ESTÁTICO ---
    - name: Ruta a Remote LAN 1
      fortios_router_static:
        vdom: "{{ fg_vdom }}"
        state: "present"
        router_static:
          seq_num: "10"
          dst: "{{ fg_remote_lan1_mask }}"      
          device: "{{ vpn_name }}"

    - name: Ruta a Remote LAN 2
      fortios_router_static:
        vdom: "{{ fg_vdom }}"
        state: "present"
        router_static:
          seq_num: "11"
          dst: "{{ fg_remote_lan2_mask }}"
          device: "{{ vpn_name }}"

    # --- POLÍTICAS DE FIREWALL ---
    - name: Politica Salida (LAN -> VPN)
      fortios_firewall_policy:
        vdom: "{{ fg_vdom }}"
        state: "present"
        firewall_policy:
          policyid: "100"
          name: "LAN-to-VPN"
          srcintf:
            - name: "{{ fg_lan1_intf }}"
            - name: "{{ fg_lan2_intf }}"
          dstintf:
            - name: "{{ vpn_name }}"
          srcaddr: 
            - name: "LOCAL_LAN1_{{ fg_lan1_cidr_raw | regex_replace('/', '_') }}"
            - name: "LOCAL_LAN2_{{ fg_lan2_cidr_raw | regex_replace('/', '_') }}"
          dstaddr: 
            - name: "REMOTE_LAN1_{{ fg_remote_lan1_cidr | regex_replace('/', '_') }}"
            - name: "REMOTE_LAN2_{{ fg_remote_lan2_cidr | regex_replace('/', '_') }}"
          action: "accept"
          schedule: "always"
          service: 
            - name: "ALL"
          nat: "disable" 
          logtraffic: "all"

    - name: Politica Entrada (VPN -> LAN)
      fortios_firewall_policy:
        vdom: "{{ fg_vdom }}"
        state: "present"
        firewall_policy:
          policyid: "101"
          name: "VPN-to-LAN"
          srcintf:
            - name: "{{ vpn_name }}"
          dstintf:
            - name: "{{ fg_lan1_intf }}"
            - name: "{{ fg_lan2_intf }}"
          srcaddr: 
            - name: "REMOTE_LAN1_{{ fg_remote_lan1_cidr | regex_replace('/', '_') }}"
            - name: "REMOTE_LAN2_{{ fg_remote_lan2_cidr | regex_replace('/', '_') }}"
          dstaddr: 
            - name: "LOCAL_LAN1_{{ fg_lan1_cidr_raw | regex_replace('/', '_') }}"
            - name: "LOCAL_LAN2_{{ fg_lan2_cidr_raw | regex_replace('/', '_') }}"
          action: "accept"
          schedule: "always"
          service: 
            - name: "ALL"
          nat: "disable" 
          logtraffic: "all"

# PLAY 2: PALO ALTO
- name: Configurar Overlay Palo Alto
  hosts: paloaltos
  connection: local
  gather_facts: no
  collections:
    - paloaltonetworks.panos
  
  vars:

        # --- GLOBAL ---
        vpn_name: "S2S-OVERLAY"
        vpn_psk: "FortinetVPN2025a1!"

        # --- CRYPTO ---
        phase1_proposal: "aes128-sha256"
        phase2_proposal: "aes128-sha256"
        dh_group: "14"
        pa_enc_algo: "aes-128-cbc"
        pa_auth_algo: "sha256"

        # --- FORTIGATE VARS ---
        fg_wan_intf: "port1"
        fg_lan1_intf: "port2"
        fg_lan2_intf: "port3"
        fg_wan_ip: "200.200.200.1"
        fg_vdom: "root"
    
        fg_lan1_cidr_raw: "10.100.102.0/24"
        fg_lan2_cidr_raw: "10.100.100.0/24"
        fg_lan1_mask: "10.100.102.0 255.255.255.0"
        fg_lan2_mask: "10.100.100.0 255.255.255.0"

        fg_remote_lan1_cidr: "10.200.202.0/24"
        fg_remote_lan2_cidr: "10.200.203.0/24"
        fg_remote_lan1_mask: "10.200.202.0 255.255.255.0"
        fg_remote_lan2_mask: "10.200.203.0 255.255.255.0"

        fg_tunnel_ip: "169.255.1.1 255.255.255.255"
        fg_remote_tunnel_ip: "169.255.1.2 255.255.255.255"
        fg_remote_gw: "100.100.100.1"

        # --- PALO ALTO VARS ---
        pa_wan_intf: "ethernet1/1"
        pa_lan1_intf: "ethernet1/2"
        pa_lan2_intf: "ethernet1/3"
        pa_zone: "VPN_Zone"

        pa_lan1_cidr: "10.200.202.0/24"
        pa_lan2_cidr: "10.200.203.0/24"
        pa_remote_lan1_cidr: "10.100.102.0/24"
        pa_remote_lan2_cidr: "10.100.100.0/24"

        pa_wan_ip: "100.100.100.1"
        pa_tunnel_ip: "169.255.1.2/32"
        pa_peer_ip: "200.200.200.1"
        pa_nexthop_ip: "169.255.1.1"

        pa_provider:
          ip_address: "10.100.100.107"
          username: "admin"
          password: "1234Wasd."


  tasks:
    - name: Configurar Interfaz Túnel
      panos_interface:
        provider: "{{ pa_provider }}"
        if_name: "tunnel.1" 
        mode: "layer3"
        ip: ["{{ pa_tunnel_ip }}"]
        vr_name: "default"
        zone_name: "{{ pa_zone }}"
        commit: False

    - name: Perfil IKE
      panos_ike_crypto_profile:
        provider: "{{ pa_provider }}"
        name: "{{ vpn_name }}-IKE"
        dh_group: ["group{{ dh_group }}"]
        encryption: ["{{ pa_enc_algo }}"]
        hash: ["{{ pa_auth_algo }}"]
        lifetime_seconds: 43200
        commit: False

    - name: Perfil IPsec
      panos_ipsec_profile:
        provider: "{{ pa_provider }}"
        name: "{{ vpn_name }}-IPSEC"
        dh_group: "group{{ dh_group }}"
        esp_encryption: ["{{ pa_enc_algo }}"]
        esp_authentication: ["{{ pa_auth_algo }}"]
        lifetime_seconds: 3600
        commit: False

    - name: IKE Gateway
      panos_ike_gateway:
        provider: "{{ pa_provider }}"
        name: "{{ vpn_name }}-GW"
        version: "ikev2"
        interface: "{{ pa_wan_intf }}"    
        peer_ip: "{{ pa_peer_ip }}"
        pre_shared_key: "{{ vpn_psk }}"
        ikev2_crypto_profile: "{{ vpn_name }}-IKE"
        enable_liveness_check: true
        liveness_check_interval: 5
        commit: False

    - name: IPSec Tunnel
      panos_ipsec_tunnel:
        provider: "{{ pa_provider }}"
        name: "{{ vpn_name }}"
        tunnel_interface: "tunnel.1"
        ike_gw: "{{ vpn_name }}-GW"
        ipsec_profile: "{{ vpn_name }}-IPSEC"
        enable_tunneling: true
        commit: False

    - name: Proxy ID
      panos_config_element:
        provider: "{{ pa_provider }}"
        xpath: "/config/devices/entry[@name='localhost.localdomain']/network/tunnel/ipsec/entry[@name='{{ vpn_name }}']/auto-key/proxy-id"
        element: |
          <entry name="Wildcard-S2S">
            <local>0.0.0.0/0</local>
            <remote>0.0.0.0/0</remote>
          </entry>
        commit: False

    - name: Ruta Estática LAN 1 (a FG)
      panos_static_route:
        provider: "{{ pa_provider }}"
        name: "Ruta-a-FG-LAN1"
        destination: "{{ pa_remote_lan1_cidr }}" 
        nexthop_type: "ip-address"
        nexthop: "{{ pa_nexthop_ip }}"
        interface: "tunnel.1"
        virtual_router: "default"
        commit: False

    - name: Ruta Estática LAN 2 (a FG)
      panos_static_route:
        provider: "{{ pa_provider }}"
        name: "Ruta-a-FG-LAN2"
        destination: "{{ pa_remote_lan2_cidr }}" 
        nexthop_type: "ip-address"
        nexthop: "{{ pa_nexthop_ip }}"
        interface: "tunnel.1"
        virtual_router: "default"
        commit: False
        
    - name: Crear Zona VPN si no existe
      panos_zone:
        provider: "{{ pa_provider }}"
        zone: "{{ pa_zone }}"
        mode: layer3
        interface: ['tunnel.1']
        commit: False

    - name: Policy Trust-VPN (Salida)
      panos_security_rule:
        provider: "{{ pa_provider }}"
        rule_name: "Permitir_Salida_{{ vpn_name }}"
        source_zone: ["trust"]
        destination_zone: ["{{ pa_zone }}"]
        source_ip: ["any"]
        destination_ip: ["{{ pa_remote_lan1_cidr }}", "{{ pa_remote_lan2_cidr }}"]
        action: "allow"
        commit: False

    - name: Policy VPN-Trust (Entrada)
      panos_security_rule:
        provider: "{{ pa_provider }}"
        rule_name: "Permitir_Entrada_{{ vpn_name }}"
        source_zone: ["{{ pa_zone }}"]
        destination_zone: ["trust"]
        source_ip: ["{{ pa_remote_lan1_cidr }}", "{{ pa_remote_lan2_cidr }}"]
        destination_ip: ["any"]
        action: "allow"
        commit: False

    - name: COMMIT
      paloaltonetworks.panos.panos_commit_firewall:
        provider: "{{ pa_provider }}"
