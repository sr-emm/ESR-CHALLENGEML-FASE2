round-color: rgba(250, 204, 21, 0.1);            color: #FACC15;            border: 1px solid rgba(250, 204, 21, 0.3);        }                /* Dot indicator */        .status-dot {            width: 8px;            height: 8px;            border-radius: 50%;            display: inline-block;        }        .status-dot.online {            background-color: #4ADE80;            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);        }        .status-dot.offline {            background-color: #F87171;        }        .status-dot.testing {            background-color: #FACC15;            animation: pulse 1.5s ease-in-out infinite;        }                /* Botones mejorados */        .btn-primary {            background: linear-gradient(135deg, #10B981 0%, #059669 100%);            transition: all 0.3s;        }        .btn-primary:hover:not(:disabled) {            background: linear-gradient(135deg, #059669 0%, #047857 100%);            transform: translateY(-2px);            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);        }                .btn-secondary {            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);            transition: all 0.3s;        }        .btn-secondary:hover:not(:disabled) {            background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);            transform: translateY(-2px);            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);        }                .btn-test {            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);            transition: all 0.3s;        }        .btn-test:hover:not(:disabled) {            background: linear-gradient(135deg, #D97706 0%, #B45309 100%);            transform: translateY(-2px);            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);        }                .btn:disabled {            opacity: 0.5;            cursor: not-allowed;        }                /* Card mejorada */     <div class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600 transition cursor-pointer"></div>                        </div>                        <span class="text-xs text-gray-300 font-mono">root@vpn-orchestrator:~# ansible-playbook site.yml</span>                        <div class="flex gap-2">                            <button onclick="copyConsole()" title="Copiar contenido" class="text-xs text-gray-400 hover:text-white transition flex items-center gap-1 bg-gray-700/50 px-2 py-1 rounded hover:bg-gray-700">                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>                                </svg>                                <span id="copyBtnText">Copiar</span>                            </button>                            <button onclick="clearConsole()" title="Limpiar consola" class="text-xs text-gray-400 hover:text-white transition bg-gray-700/50 px-2 py-1 rounded hover:bg-gray-700">                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>                                </svg>                            </button>                        </div>                    </div>                                        <!-- Área de Logs -->                    <div id="consoleOutput" class="flex-1 overflow-y-auto font-mono text-xs md:text-sm space-y-1 pb-4">                        <div class="log-entry log-info">                            <span class="text-gray-500">[INIT]</span>                             <span class="text-gray-300">Sistema listo. Esperando órdenes...</span>                        </div>                    </div>                </div>            </div>        </div>    </div>    <!-- JavaScript -->    <script>        // Configuración de puertos        const fgPorts = Array.from({length:10},(_,i)=>`port${i+1}`);        const paPorts = Array.from({length:10},(_,i)=>`ethernet1/${i+1}`);                function fillSelects(prefix, ports, def) {            ['wan_intf', 'lan1_intf', 'lan2_intf'].forEach((k, i) => {                const sel = document.getElementById(`${prefix}_${k}`);                sel.innerHTML = '';                ports.forEach(p => {                    let opt = document.createElement('option');                    opt.value = p; opt.text = p;                    sel.appendChild(opt);                });                sel.value = Object.values(def)[i];            });        }        function syncIPs() {            document.getElementById('pa_remote_wan_ip').value = document.getElementsByName('pa_wan_ip')[0].value;            document.getElementById('pa_remote_tunnel_ip').value = document.getElementById('pa_tunnel_ip').value;            document.getElementById('fg_remote_wan_ip').value = document.getElementsByName('fg_wan_ip')[0].value;            document.getElementById('fg_remote_tunnel_ip_pa').value = document.getElementById('fg_tunnel_ip').value;        }        // Console Logger mejorado        const consoleOut = document.getElementById('consoleOutput');                function log(msg, type='info') {            const div = document.createElement('div');            div.className = 'log-entry slide-in';                        let color = 'text-gray-300';            let icon = '●';            let bgColor = '';                        // Detección inteligente de mensajes positivos            if(msg.match(/ok=\d+|SUCCESS|successful|completed|✓|✔|done|passed|Conectado|Online/i)) {                color = 'log-success';                icon = '✓';                bgColor = 'rgba(74, 222, 128, 0.05)';            }             // Detección de cambios y warnings            else if(msg.match(/changed=\d+|WARN|warning|skip|Testing|⚠/i)) {                color = 'log-warn';                icon = '⚠';                bgColor = 'rgba(250, 204, 21, 0.05)';            }             // Detección de errores            else if(msg.match(/failed=\d+|ERROR|error|failed|unreachable|fatal|✗|Offline|Timeout/i)) {                color = 'log-error';                icon = '✗';                bgColor = 'rgba(248, 113, 113, 0.05)';            }             // Tareas y plays (azul)            else if(msg.match(/TASK|PLAY|RUNNING|Configurar|Instalar|Crear|Policy|Ruta|Perfil/i)) {                color = 'log-info';                icon = '▶';                bgColor = 'rgba(56, 189, 248, 0.05)';            }            // Recap y resúmenes            else if(msg.match(/PLAY RECAP|recap|summary/i)) {                color = 'text-purple-400';                icon = '📊';                bgColor = 'rgba(168, 85, 247, 0.05)';            }            // Mensajes de inicio            else if(msg.match(/INIT|Iniciando|Starting|BEGIN/i)) {                color = 'text-cyan-400';                icon = '🚀';                bgColor = 'rgba(34, 211, 238, 0.05)';            }                        const timestamp = new Date().toLocaleTimeString();            div.style.backgroundColor = bgColor;            div.innerHTML = `                <span class="text-gray-600">[${timestamp}]</span>                 <span class="${color}">${icon}</span>                 <span class="${color}">${escapeHtml(msg)}</span>            `;            consoleOut.appendChild(div);            consoleOut.scrollTop = consoleOut.scrollHeight;        }        function escapeHtml(text) {            const div = document.createElement('div');            div.textContent = text;            return div.innerHTML;        }        function clearConsole() {            consoleOut.innerHTML = '<div class="log-entry log-info"><span class="text-gray-500">[INIT]</span> <span class="text-gray-300">Consola limpiada. Sistema listo.</span></div>';        }        async function copyConsole() {            const consoleContent = document.getElementById('consoleOutput');            const logs = consoleContent.querySelectorAll('.log-entry');                        // Extraer texto limpio sin HTML y sin espacios extras            let textContent = '';            logs.forEach(log => {                // Obtener el texto y limpiar espacios múltiples                const text = (log.textContent || log.innerText)                    .replace(/\s+/g, ' ')  // Reemplazar múltiples espacios por uno solo                    .trim();                // Eliminar espacios al inicio y final                if (text) {  // Solo agregar si hay contenido                    textContent += text + '\n';                }            });                        const btnText = document.getElementById('copyBtnText');            const originalText = btnText.textContent;                        try {                // Intentar con la API moderna de Clipboard                await navigator.clipboard.writeText(textContent);                                // Feedback visual                btnText.textContent = '¡Copiado!';                btnText.parentElement.classList.add('text-green-400');                                setTimeout(() => {                    btnText.textContent = originalText;                    btnText.parentElement.classList.remove('text-green-400');                }, 2000);                                log('✓ Contenido de la consola copiado al portapapeles', 'success');            } catch (err) {                console.log('Clipboard API failed, using fallback', err);                                // Fallback: Crear textarea temporal                const textarea = document.createElement('textarea');                textarea.value = textContent;                textarea.style.position = 'fixed';                textarea.style.left = '-9999px';                textarea.style.top = '0';                document.body.appendChild(textarea);                textarea.focus();                textarea.select();                                try {                    const successful = document.execCommand('copy');                    if (successful) {                        btnText.textContent = '¡Copiado!';                        btnText.parentElement.classList.add('text-green-400');                                                setTimeout(() => {                            btnText.textContent = originalText;                            btnText.parentElement.classList.remove('text-green-400');                        }, 2000);                                                log('✓ Contenido copiado (método alternativo)', 'success');                    } else {                        log('✗ No se pudo copiar el contenido', 'error');                    }                } catch(e) {                    console.error('Fallback copy failed', e);                    log('✗ Error al copiar: Intenta copiar manualmente con Ctrl+C', 'error');                }                                document.body.removeChild(textarea);            }        }        // Instalación de Dependencias        async function installDependencies() {            const btn = document.getElementById('installDepsButton');            const originalHTML = btn.innerHTML;                        btn.disabled = true;            btn.innerHTML = '<span class="pulse-animation">Instalando...</span>';                        log('═══════════════════════════════════════════════════', 'info');            log('🚀 Iniciando instalación de dependencias...', 'info');            log('═══════════════════════════════════════════════════', 'info');                        try {                const response = await fetch('/install-dependencies', {                    method: 'POST',                    headers: {'Content-Type': 'application/json'}                });                                const reader = response.body.getReader();                const decoder = new TextDecoder();                                while(true) {                    const {done, value} = await reader.read();                    if(done) break;                    const text = decoder.decode(value);                    const lines = text.split('\n');                    lines.forEach(l => {                         if(l.trim()) {                            // Detectar tipo de mensaje                            if (l.includes('[SUCCESS]') || l.includes('✓')) {                                log(l, 'success');                            } else if (l.includes('[ERROR]') || l.includes('✗')) {                                log(l, 'error');                            } else if (l.includes('[WARN]') || l.includes('⚠')) {                                log(l, 'warn');                            } else if (l.includes('[STEP]') || l.includes('→')) {                                log(l, 'info');                            } else {                                log(l);                            }                        }                    });                }                                log('═══════════════════════════════════════════════════', 'info');                log('✓ Proceso de instalación completado', 'success');                log('💡 Ahora puedes ejecutar el playbook', 'info');                            } catch(err) {                log('✗ Error en instalación: ' + err.message, 'error');            } finally {                btn.disabled = false;                btn.innerHTML = originalHTML;            }        }        // Test de Conectividad        document.getElementById('testButton').addEventListener('click', async () => {            const btn = document.getElementById('testButton');            const form = document.getElementById('vpnForm');            const data = Object.fromEntries(new FormData(form));                        btn.disabled = true;            btn.innerHTML = '<span class="pulse-animation">Testing...</span>';                        log('Iniciando test de conectividad...', 'info');                        // Update status badges to testing            updateStatus('fortigate', 'testing', 'Testing...');            updateStatus('paloalto', 'testing', 'Testing...');                        try {                const response = await fetch('/test-connectivity', {                    method: 'POST',                    headers: {'Content-Type': 'application/json'},                    body: JSON.stringify(data)                });                                const results = await response.json();                                // FortiGate                if(results.fortigate.success) {                    log(`✓ FortiGate (${results.fortigate.ip}): ${results.fortigate.message}`, 'success');                    updateStatus('fortigate', 'online', 'Online');                } else {                    log(`✗ FortiGate (${results.fortigate.ip}): ${results.fortigate.message}`, 'error');                    updateStatus('fortigate', 'offline', 'Offline');                }                                // Palo Alto                if(results.paloalto.success) {                    log(`✓ Palo Alto (${results.paloalto.ip}): ${results.paloalto.message}`, 'success');                    updateStatus('paloalto', 'online', 'Online');                } else {                    log(`✗ Palo Alto (${results.paloalto.ip}): ${results.paloalto.message}`, 'error');                    updateStatus('paloalto', 'offline', 'Offline');                }                                if(results.fortigate.success && results.paloalto.success) {                    log('✓ Todos los dispositivos están accesibles', 'success');                } else {                    log('⚠ Algunos dispositivos no están accesibles', 'warn');                }                            } catch(err) {                log('✗ Error en test de conectividad: ' + err.message, 'error');                updateStatus('fortigate', 'offline', 'Error');                updateStatus('paloalto', 'offline', 'Error');            } finally {                btn.disabled = false;                btn.innerHTML = `                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>                    </svg>                    Test Conectividad                `;            }        });        function updateStatus(device, status, text) {            const el = document.getElementById(device === 'fortigate' ? 'fgStatus' : 'paStatus');            const deviceName = device === 'fortigate' ? 'FortiGate' : 'Palo Alto';                        el.className = `status-badge ${status}`;            el.innerHTML = `                <span class="status-dot ${status}"></span>                <span>${deviceName}: ${text}</span>            `;        }        // Ejecución de Ansible (Streaming)        document.getElementById('vpnForm').addEventListener('submit', async (e) => {            e.preventDefault();            syncIPs();            const data = Object.fromEntries(new FormData(e.target));                        log('══════════════════════════════════════════', 'info');            log('Iniciando ejecución de Ansible Playbook...', 'info');            log('══════════════════════════════════════════', 'info');                        const btn = document.getElementById('executeButton');            btn.disabled = true;            btn.innerHTML = '<span class="pulse-animation">Ejecutando...</span>';                        try {                const response = await fetch('/run', {                    method: 'POST',                    headers: {'Content-Type': 'application/json'},                    body: JSON.stringify(data)                });                                const reader = response.body.getReader();                const decoder = new TextDecoder();                                while(true) {                    const {done, value} = await reader.read();                    if(done) break;                    const text = decoder.decode(value);                    const lines = text.split('\n');                    lines.forEach(l => { if(l.trim()) log(l); });                }                                log('══════════════════════════════════════════', 'info');                log('Ejecución completada', 'success');                            } catch(err) {                log('✗ Error de conexión: ' + err.message, 'error');            } finally {                btn.disabled = false;                btn.innerHTML = `                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>                    </svg>                    Ejecutar (Live)                `;            }        });        // Descarga de ZIP        document.getElementById('downloadButton').addEventListener('click', async () => {            syncIPs();            const form = document.getElementById('vpnForm');            const data = Object.fromEntries(new FormData(form));                        log('Generando archivos de configuración...', 'info');                        const btn = document.getElementById('downloadButton');            btn.disabled = true;            btn.innerHTML = '<span class="pulse-animation">Generando...</span>';                        try {                const res = await fetch('/generate', {                    method: 'POST',                    headers: {'Content-Type': 'application/json'},                    body: JSON.stringify(data)                });                                if(res.ok) {                    const blob = await res.blob();                    const url = window.URL.createObjectURL(blob);                    const a = document.createElement('a');                    a.href = url;                                        // Extract filename from Content-Disposition or use default                    const contentDisposition = res.headers.get('Content-Disposition');                    let filename = 'vpn_config.zip';                    if (contentDisposition) {                        const filenameMatch = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);                        if (filenameMatch && filenameMatch[1]) {                            filename = filenameMatch[1].replace(/['"]/g, '');                        }                    }                                        a.download = filename;                    document.body.appendChild(a);                    a.click();                    document.body.removeChild(a);                    window.URL.revokeObjectURL(url);                                        log('✓ ZIP descargado correctamente: ' + filename, 'success');                } else {                    const error = await res.json();                    log('✗ Error generando ZIP: ' + (error.error || 'Unknown error'), 'error');                }            } catch(e) {                log('✗ Error de red: ' + e.message, 'error');            } finally {                btn.disabled = false;                btn.innerHTML = `                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>                    </svg>                    Descargar ZIP                `;            }        });        // Inicialización        document.addEventListener('DOMContentLoaded', () => {            fillSelects('fg', fgPorts, {'wan_intf':'port1','lan1_intf':'port2','lan2_intf':'port3'});            fillSelects('pa', paPorts, {'wan_intf':'ethernet1/1','lan1_intf':'ethernet1/2','lan2_intf':'ethernet1/3'});                        // Auto-sync IPs            ['fg_wan_ip','pa_wan_ip','fg_tunnel_ip','pa_tunnel_ip'].forEach(id => {                let el = document.getElementsByName(id)[0] || document.getElementById(id);                if(el) el.addEventListener('input', syncIPs);            });                        log('Sistema inicializado correctamente', 'success');            log('Componentes cargados: FortiGate Module, Palo Alto Module, Ansible Engine', 'info');        });    </script></body></html>
