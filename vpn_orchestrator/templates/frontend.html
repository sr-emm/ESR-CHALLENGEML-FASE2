<!DOCTYPE html><html lang="es" class="dark"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>VPN Orchestrator - Live Execution</title>    <script src="https://cdn.tailwindcss.com"></script>    <script>        tailwind.config = {            darkMode: 'class',            theme: {                extend: {                    colors: {                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },                        console: { bg: '#0F172A', text: '#38BDF8' }                    },                    fontFamily: {                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],                    }                }            }        }    </script>    <style>        body { font-family: 'Courier New', Courier, monospace; }        .input-dark {            background-color: #374151; border: 1px solid #4b5563; color: #f3f4f6;            height: 2.5rem; display: flex; align-items: center;        }        .input-dark:focus { border-color: #60a5fa; ring: 2px solid #60a5fa; outline: none; }                /* Consola Estilo Hacker */        .console-window {            background-color: #0F172A;            border: 1px solid #334155;            font-family: 'Menlo', 'Monaco', monospace;            font-size: 0.80rem;            line-height: 1.4;            color: #E2E8F0;            overflow-y: auto;            height: 100%;            min-height: 600px;        }        .log-entry { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }        .log-success { color: #4ADE80; }        .log-warn { color: #FACC15; }        .log-error { color: #F87171; }        .log-info { color: #38BDF8; }        .cursor-blink { animation: blink 1s step-end infinite; }        @keyframes blink { 50% { opacity: 0; } }    </style></head><body class="bg-gray-950 text-gray-100 min-h-screen p-4">    <div class="max-w-[98%] mx-auto space-y-6">                <!-- Header -->        <div class="text-center mb-6">            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-blue-500">                VPN Orchestrator: Live Execution            </h1>            <p class="text-gray-400 text-xs">FortiGate <-> Palo Alto // Ansible Automation Engine</p>        </div>        <!-- GRID DE 4 COLUMNAS -->        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">                        <!-- COL 1-2: FORMULARIO -->            <div class="xl:col-span-2 space-y-4">                <form id="vpnForm" class="space-y-4">                    <!-- Configuración Global -->                    <div class="bg-gray-900 border border-gray-800 rounded p-4 shadow-lg">                        <h2 class="text-lg font-bold text-gray-200 mb-3 border-b border-gray-700 pb-1">Configuración Global</h2>                        <div class="grid grid-cols-2 gap-4">                            <div><label class="text-xs text-gray-500">Nombre Túnel</label><input type="text" name="tunnel_name" value="S2S-OVERLAY" class="w-full input-dark rounded px-2 text-xs" required></div>                            <div><label class="text-xs text-gray-500">PSK</label><input type="text" name="psk" value="FortinetVPN2025a1!" class="w-full input-dark rounded px-2 text-xs" required></div>                            <div>                                <label class="text-xs text-gray-500">Diffie-Hellman</label>                                <select name="dh_group" class="w-full input-dark rounded px-2 text-xs">                                    <option value="14" selected>Group 14</option>                                    <option value="19">Group 19</option>                                    <option value="21">Group 21</option>                                </select>                            </div>                            <div>                                <label class="text-xs text-gray-500">Perfil</label>                                <select name="crypto_profile" class="w-full input-dark rounded px-2 text-xs">                                    <option value="AES128-SHA256" selected>Producción</option>                                    <option value="AES256-SHA256">Alta Seguridad</option>                                    <option value="DES-SHA256">Legacy (LAB)</option>                                </select>                            </div>                        </div>                    </div>                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">                        <!-- FortiGate -->                        <div class="bg-gray-900 border border-red-900/30 rounded p-4">                            <h3 class="text-sm font-bold text-red-400 mb-3">Site A: FortiGate</h3>                            <div class="space-y-2">                                <div class="grid grid-cols-2 gap-2">                                    <div><label class="text-[10px] text-gray-500">MGMT IP</label><input type="text" name="fg_mgmt_ip" value="10.100.100.151" class="w-full input-dark rounded px-2 text-xs"></div>                                    <div><label class="text-[10px] text-gray-500">WAN IP</label><input type="text" name="fg_wan_ip" value="10.100.100.151" class="w-full input-dark rounded px-2 text-xs"></div>                                </div>                                <div class="grid grid-cols-2 gap-2">                                    <div><label class="text-[10px] text-gray-500">User</label><input type="text" name="fg_user" value="admin" class="w-full input-dark rounded px-2 text-xs"></div>                                    <div><label class="text-[10px] text-gray-500">Pass</label><input type="password" name="fg_password" value="1234wasd" class="w-full input-dark rounded px-2 text-xs"></div>                                </div>                                <hr class="border-gray-800 my-2">                                <div><label class="text-[10px] text-gray-500">WAN Intf</label><select name="fg_wan_intf" id="fg_wan_intf" class="w-full input-dark rounded px-2 text-xs"></select></div>                                <div><label class="text-[10px] text-gray-500">LAN 1 (Intf/CIDR)</label><div class="flex gap-1"><select name="fg_lan1_intf" id="fg_lan1_intf" class="w-1/2 input-dark rounded px-2 text-xs"></select><input type="text" name="fg_lan1_cidr" value="10.10.10.0/24" class="w-1/2 input-dark rounded px-2 text-xs"></div></div>                                <div><label class="text-[10px] text-gray-500">LAN 2 (Intf/CIDR)</label><div class="flex gap-1"><select name="fg_lan2_intf" id="fg_lan2_intf" class="w-1/2 input-dark rounded px-2 text-xs"></select><input type="text" name="fg_lan2_cidr" value="10.10.20.0/24" class="w-1/2 input-dark rounded px-2 text-xs"></div></div>                                <div><label class="text-[10px] text-red-400 font-bold">Tunnel IP</label><input type="text" id="fg_tunnel_ip" name="fg_tunnel_ip" value="169.255.1.1" class="w-full bg-gray-800 border-gray-700 text-white rounded px-2 h-8 text-xs"></div>                                <input type="hidden" name="fg_vdom_name" value="root">                            </div>                        </div>                        <!-- Palo Alto -->                        <div class="bg-gray-900 border border-sky-900/30 rounded p-4">                            <h3 class="text-sm font-bold text-sky-400 mb-3">Site B: Palo Alto</h3>                            <div class="space-y-2">                                <div class="grid grid-cols-2 gap-2">                                    <div><label class="text-[10px] text-gray-500">MGMT IP</label><input type="text" name="pa_mgmt_ip" value="10.100.100.115" class="w-full input-dark rounded px-2 text-xs"></div>                                    <div><label class="text-[10px] text-gray-500">WAN IP</label><input type="text" name="pa_wan_ip" value="10.100.100.115" class="w-full input-dark rounded px-2 text-xs"></div>                                </div>                                <div class="grid grid-cols-2 gap-2">                                    <div><label class="text-[10px] text-gray-500">User</label><input type="text" name="pa_user" value="admin" class="w-full input-dark rounded px-2 text-xs"></div>                                    <div><label class="text-[10px] text-gray-500">Pass</label><input type="password" name="pa_password" value="1234wasd" class="w-full input-dark rounded px-2 text-xs"></div>                                </div>                                <hr class="border-gray-800 my-2">                                <div><label class="text-[10px] text-gray-500">WAN Intf</label><select name="pa_wan_intf" id="pa_wan_intf" class="w-full input-dark rounded px-2 text-xs"></select></div>                                <div><label class="text-[10px] text-gray-500">LAN 1 (Intf/CIDR)</label><div class="flex gap-1"><select name="pa_lan1_intf" id="pa_lan1_intf" class="w-1/2 input-dark rounded px-2 text-xs"></select><input type="text" name="pa_lan1_cidr" value="172.16.10.0/24" class="w-1/2 input-dark rounded px-2 text-xs"></div></div>                                <div><label class="text-[10px] text-gray-500">LAN 2 (Intf/CIDR)</label><div class="flex gap-1"><select name="pa_lan2_intf" id="pa_lan2_intf" class="w-1/2 input-dark rounded px-2 text-xs"></select><input type="text" name="pa_lan2_cidr" value="172.16.20.0/24" class="w-1/2 input-dark rounded px-2 text-xs"></div></div>                                <div><label class="text-[10px] text-sky-400 font-bold">Tunnel IP</label><input type="text" id="pa_tunnel_ip" name="pa_tunnel_ip" value="169.255.1.2" class="w-full bg-gray-800 border-gray-700 text-white rounded px-2 h-8 text-xs"></div>                                <input type="hidden" name="pa_zone_name" value="VPN_Zone">                                <input type="hidden" id="pa_remote_wan_ip" name="pa_remote_wan_ip">                                <input type="hidden" id="pa_remote_tunnel_ip" name="pa_remote_tunnel_ip">                                <input type="hidden" id="fg_remote_wan_ip" name="fg_remote_wan_ip">                                <input type="hidden" id="fg_remote_tunnel_ip_pa" name="fg_remote_tunnel_ip_pa">                            </div>                        </div>                    </div>                    <!-- Botones -->                    <div class="grid grid-cols-2 gap-4">                         <button type="submit" id="executeButton" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-700 text-white font-bold py-3 rounded shadow-lg transition">                            ▶ EJECUTAR (LIVE)                        </button>                        <button type="button" id="downloadButton" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded shadow-lg transition">                            ⬇ Solo Descargar ZIP                        </button>                    </div>                </form>            </div>            <!-- COL 3-4: CONSOLA DE RESULTADOS (50% del ancho) -->            <div class="xl:col-span-2 h-full min-h-[600px]">                <div class="console-window rounded-lg p-4 font-mono text-sm h-full flex flex-col relative">                    <!-- Barra superior -->                    <div class="bg-gray-800 border-b border-gray-700 p-2 flex justify-between rounded-t-lg mb-2">                        <div class="flex gap-2">                            <div class="w-3 h-3 rounded-full bg-red-500"></div>                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>                            <div class="w-3 h-3 rounded-full bg-green-500"></div>                        </div>                        <span class="text-xs text-gray-400">root@vpn-orchestrator:~# ansible-playbook site.yml</span>                    </div>                    <!-- Área de Logs -->                    <div id="consoleOutput" class="flex-1 overflow-y-auto font-mono text-xs md:text-sm space-y-1 pb-4">                        <div class="log-entry"><span class="text-gray-500">[INIT]</span> <span class="text-gray-300">Sistema listo.</span></div>                    </div>                </div>            </div>        </div>    </div>    <!-- JS Logic -->    <script>        // Init ports logic (Keeping it brief)        const fgPorts = Array.from({length:10},(_,i)=>`port${i+1}`);        const paPorts = Array.from({length:10},(_,i)=>`ethernet1/${i+1}`);                function fillSelects(prefix, ports, def) {            ['wan_intf', 'lan1_intf', 'lan2_intf'].forEach((k, i) => {                const sel = document.getElementById(`${prefix}_${k}`);                sel.innerHTML = '';                ports.forEach(p => {                    let opt = document.createElement('option');                    opt.value = p; opt.text = p;                    sel.appendChild(opt);                });                sel.value = Object.values(def)[i];            });        }        function syncIPs() {            document.getElementById('pa_remote_wan_ip').value = document.getElementsByName('pa_wan_ip')[0].value;            document.getElementById('pa_remote_tunnel_ip').value = document.getElementById('pa_tunnel_ip').value;            document.getElementById('fg_remote_wan_ip').value = document.getElementsByName('fg_wan_ip')[0].value;            document.getElementById('fg_remote_tunnel_ip_pa').value = document.getElementById('fg_tunnel_ip').value;        }        // Console Logger        const consoleOut = document.getElementById('consoleOutput');        function log(msg, type='info') {            const div = document.createElement('div');            let color = 'text-gray-300';            if(msg.includes('ok=')) color = 'text-green-400';            if(msg.includes('changed=')) color = 'text-yellow-400';            if(msg.includes('failed=')) color = 'text-red-500';            if(msg.includes('ERROR')) color = 'text-red-500';                        div.innerHTML = `<span class="text-gray-500">[LOG]</span> <span class="${color}">${msg}</span>`;            consoleOut.appendChild(div);            consoleOut.scrollTop = consoleOut.scrollHeight;        }        // --- MODO EJECUCIÓN (STREAMING) ---        document.getElementById('vpnForm').addEventListener('submit', async (e) => {            e.preventDefault();            syncIPs();            const data = Object.fromEntries(new FormData(e.target));                        log('Iniciando ejecución de Ansible...', 'info');            const btn = document.getElementById('executeButton');            btn.disabled = true; btn.classList.add('opacity-50');            try {                const response = await fetch('/run', {                    method: 'POST',                    headers: {'Content-Type': 'application/json'},                    body: JSON.stringify(data)                });                                const reader = response.body.getReader();                const decoder = new TextDecoder();                                while(true) {                    const {done, value} = await reader.read();                    if(done) break;                    const text = decoder.decode(value);                    const lines = text.split('\n');                    lines.forEach(l => { if(l.trim()) log(l); });                }            } catch(err) {                log('Error de conexión: ' + err.message, 'error');            } finally {                btn.disabled = false; btn.classList.remove('opacity-50');            }        });        // --- MODO DESCARGA (ZIP) ---        document.getElementById('downloadButton').addEventListener('click', async () => {            syncIPs();            const form = document.getElementById('vpnForm');            const data = Object.fromEntries(new FormData(form));                        log('Generando ZIP...', 'info');            try {                const res = await fetch('/generate', {                    method: 'POST',                    headers: {'Content-Type': 'application/json'},                    body: JSON.stringify(data)                });                if(res.ok) {                    const blob = await res.blob();                    const url = window.URL.createObjectURL(blob);                    const a = document.createElement('a');                    a.href = url;                    a.download = res.headers.get('X-Filename') || 'config.zip';                    document.body.appendChild(a);                    a.click();                    log('ZIP descargado correctamente.', 'success');                } else {                    log('Error generando ZIP', 'error');                }            } catch(e) { log('Error de red', 'error'); }        });        document.addEventListener('DOMContentLoaded', () => {            fillSelects('fg', fgPorts, {'wan_intf':'port1','lan1_intf':'port2','lan2_intf':'port3'});            fillSelects('pa', paPorts, {'wan_intf':'ethernet1/1','lan1_intf':'ethernet1/2','lan2_intf':'ethernet1/3'});                        // Listeners            ['fg_wan_ip','pa_wan_ip','fg_tunnel_ip','pa_tunnel_ip'].forEach(id => {                let el = document.getElementsByName(id)[0] || document.getElementById(id);                if(el) el.addEventListener('input', syncIPs);            });        });    </script></body></html>
